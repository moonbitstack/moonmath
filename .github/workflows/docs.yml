name: Docs

# Publish the site: the frontispiece, the guide, the generated lexicon and the
# workshop. The reference is regenerated here and the build fails if the
# committed copy is stale; the workshop's copy of the library is compiled here
# and never committed.

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: the wider type, from the branch that carries it
        shell: bash
        run: |
          # `moon.work` resolves `moonbitstack/moonnum` from a sibling checkout:
          # the published release predates `BigFloat`. This step is what that
          # costs until the release lands, and it is the whole of what has to go.
          git clone --depth 1 --branch feat/bigfloat https://github.com/moonbitstack/moonnum.git ../moonnum

      - name: install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: the API reference is up to date
        run: |
          python3 scripts/gen_api.py
          git diff --exit-code docs/api.html

      # The workshop runs the library itself: compile it with the JavaScript
      # backend and put the bundle beside the page. The bundle is a build
      # product and is not committed.
      - name: compile the library to JavaScript for the workshop
        run: |
          moon build --target js --release src/examples/web
          # Found rather than named: a workspace puts the module's name between
          # `build` and the package, and a path written for one layout breaks in
          # the other.
          bundle=$(find _build -path '*js/release/build/*examples/web/web.js' | head -n 1)
          test -n "$bundle"
          cp "$bundle" docs/assets/moonmath.js

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
